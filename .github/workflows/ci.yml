name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build client
        run: npm run build

      - name: Boot the server and check it answers
        env:
          JWT_SECRET: ci-only-secret-not-used-anywhere-real
        run: |
          node server/src/index.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/api/reference >/dev/null
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/
          kill $SERVER_PID
